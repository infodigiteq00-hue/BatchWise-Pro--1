name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:39281/api
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify UI output
        run: |
          test -f frontend/.vercel/output/functions/__server.func/index.mjs
          test -d frontend/.vercel/output/static

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-ui
          path: frontend/.vercel/output/
          if-no-files-found: error

  build-windows:
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-ui
          path: frontend/.vercel/output

      - name: Verify UI on disk
        shell: bash
        run: test -f frontend/.vercel/output/functions/__server.func/index.mjs

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
        env:
          CI: true
          SKIP_UI_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: desktop/release/BatchWise-Pro-Windows-Setup.exe
          if-no-files-found: error

  build-mac:
    needs: build-ui
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-ui
          path: frontend/.vercel/output

      - name: Verify UI on disk
        run: test -f frontend/.vercel/output/functions/__server.func/index.mjs

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build macOS installer
        working-directory: desktop
        run: npm run dist:mac
        env:
          CI: true
          SKIP_UI_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: desktop/release/BatchWise-Pro-macOS.dmg
          if-no-files-found: error

  build-linux:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-ui
          path: frontend/.vercel/output

      - name: Verify UI on disk
        run: test -f frontend/.vercel/output/functions/__server.func/index.mjs

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build Linux package
        working-directory: desktop
        run: npm run dist:linux
        env:
          CI: true
          SKIP_UI_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/release/BatchWise-Pro-Linux.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.build-windows.result == 'success' &&
      needs.build-mac.result == 'success' &&
      needs.build-linux.result == 'success'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-win
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: artifacts

      - name: Verify all 3 installers
        run: |
          set -e
          find artifacts -type f -name 'BatchWise-Pro-Windows-Setup.exe' | grep -q .
          find artifacts -type f -name 'BatchWise-Pro-macOS.dmg' | grep -q .
          find artifacts -type f -name 'BatchWise-Pro-Linux.zip' | grep -q .
          echo "All platform installers found:"
          find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BatchWise Pro ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
