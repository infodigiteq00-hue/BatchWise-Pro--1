name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (once for all platforms)
        working-directory: frontend
        run: npm ci && npm run build
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:39281/api
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify UI build output
        run: |
          du -sh frontend/.vercel/output
          test -f frontend/.vercel/output/functions/__server.func/index.mjs
          test -d frontend/.vercel/output/static
          ls frontend/.vercel/output/static | head -5

      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui
          path: frontend/.vercel/output/
          compression-level: 0
          if-no-files-found: error

  build:
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Download prebuilt UI
        uses: actions/download-artifact@v4
        with:
          name: frontend-ui
          path: _ui-artifact

      - name: Place UI into project tree
        shell: bash
        run: |
          rm -rf frontend/.vercel/output
          mkdir -p frontend/.vercel/output
          cp -a _ui-artifact/. frontend/.vercel/output/
          du -sh frontend/.vercel/output
          test -f frontend/.vercel/output/functions/__server.func/index.mjs
          test -d frontend/.vercel/output/static
          ls frontend/.vercel/output/static | head -3

      - name: Install backend dependencies (for bundle)
        run: npm ci --omit=dev
        working-directory: backend

      - name: Install Linux AppImage dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 file rpm
          sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2 2>/dev/null || true

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build desktop installer
        shell: bash
        working-directory: desktop
        run: |
          set -euxo pipefail
          npm run dist:${{ matrix.platform }}
        env:
          CI: true
          SKIP_UI_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: http://127.0.0.1:39281/api

      - name: List release output
        shell: bash
        working-directory: desktop
        run: ls -la release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/release/*
          if-no-files-found: error

  release:
    needs: [build-ui, build]
    runs-on: ubuntu-latest
    if: always() && needs.build-ui.result == 'success' && needs.build.result != 'cancelled'

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f 2>/dev/null | head -50 || echo "no artifacts dir"

      - name: Check for installer files
        id: check
        run: |
          count=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) 2>/dev/null || true
          if [ "$count" = "0" ]; then
            echo "::warning::No CI installers — release may already have manual uploads."
            exit 0
          fi

      - name: Publish GitHub Release
        if: steps.check.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BatchWise Pro ${{ github.ref_name }}
          allowUpdates: true
          make_latest: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
